[project]
name = "synthux"
version = "0.1.0"
description = "SynthUX — Synthetic UX Research Engine (predictive usability testing)"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.5",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]
ui = ["gradio>=4.19"]
db = ["sqlalchemy>=2.0", "psycopg[binary]>=3.1", "pgvector>=0.2"]
live = ["huggingface-hub>=0.23", "playwright>=1.42"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["synthux*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
